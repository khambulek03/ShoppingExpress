name: Product Service CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  Build-test-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Debug - list ProductService files
        run: ls -la ProductService

      - name: Grant execute permission for mvnw
        run: chmod +x ProductService/mvnw

      - name: Build and Test application 
        run: ./ProductService/mvnw --batch-mode verify